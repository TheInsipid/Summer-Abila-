<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.calculator{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    width:260px;
}

#display{
    width:100%;
    height:50px;
    font-size:24px;
    margin-bottom:10px;
    text-align:right;
    padding:5px;
    border:2px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:45px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#f2f2f2;
    transition:0.2s;
}

button:hover{
    background:#ddd;
}

.operator{
    background:#4facfe;
    color:white;
}

.equal{
    background:#00c853;
    color:white;
}

.clear{
    background:#ff5252;
    color:white;
}
</style>
</head>

<body>

<div class="calculator">
<input type="text" id="display" disabled>

<div class="buttons">
<button onclick="clearDisplay()" class="clear">C</button>
<button onclick="append('/')" class="operator">&divide;</button>
<button onclick="append('*')" class="operator">&times;</button>
<button onclick="deleteLast()">&lArr;</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('-')" class="operator">&minus;</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('+')" class="operator">+</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="calculate()" class="equal">=</button>

<button onclick="append('0')" style="grid-column:span 2;">0</button>
<button onclick="append('.')">.</button>
</div>
</div>

<script>
let display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function deleteLast(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value = eval(display.value);
    }catch{
        display.value = "Error";
    }
}
</script>

</body>
</html>
